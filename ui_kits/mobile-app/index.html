<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarePlate — Mobile App UI Kit</title>
<link rel="stylesheet" href="kit.css">
<style>
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #scaler { transform-origin: center center; }
</style>
</head>
<body>
  <div id="stage"><div id="scaler"><div id="root"></div></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="RecipeScreens.jsx"></script>
  <script type="text/babel" src="CookScreens.jsx"></script>
  <script type="text/babel" src="OtherScreens.jsx"></script>
  <script type="text/babel" src="CollectionScreens.jsx"></script>
  <script type="text/babel" src="MoreScreens.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <script>
    function fit() {
      const pad = 24;
      const s = Math.min((window.innerWidth - pad) / 390, (window.innerHeight - pad) / 844, 1.1);
      document.getElementById('scaler').style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
