<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>

  .bowl { color: var(--fg3); margin-bottom: 18px; line-height: 0; }
  .title { font-size: 20px; font-weight: 600; color: var(--fg1); }

</style>
</head>
<body>

      <path d="M16 4a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2"></path>

</html>
