<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 16px 28px; }
  .section { margin-bottom: 18px; }
  .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 8px; }
  .ing { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; }
  .ing .name { font-size: 16px; color: var(--fg1); font-weight: 500; }
  .ing .amt { font-size: 15px; color: var(--fg2); font-weight: 500; }
</style>
</head>
<body>
  <div class="section">
    <div class="lbl">Base</div>
    <div class="ing"><span class="name">Spaghetti</span><span class="amt">200 g</span></div>
    <div class="ing"><span class="name">Unsalted butter</span><span class="amt">3 tbsp</span></div>
    <div class="ing"><span class="name">Garlic, minced</span><span class="amt">4 cloves</span></div>
  </div>
  <div class="section" style="margin-bottom:0">
    <div class="lbl">To finish</div>
    <div class="ing"><span class="name">Parmesan, grated</span><span class="amt">½ cup</span></div>
    <div class="ing"><span class="name">Parsley</span><span class="amt">2 tbsp</span></div>
  </div>
</body>
</html>
