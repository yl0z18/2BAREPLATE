<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 26px 32px; display: flex; align-items: center; gap: 32px; }
  .icon { width: 132px; height: 132px; border-radius: 30px; box-shadow: var(--shadow-md); }
  .copy h3 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  .copy p { margin: 0; font-size: 14px; color: var(--fg2); font-weight: 500; line-height: 1.5; max-width: 380px; }
  .copy .tag { margin-top: 10px; font-size: 12px; color: var(--fg3); font-weight: 600; }
</style>
</head>
<body>
  <img class="icon" src="../assets/app-icon.svg" alt="BarePlate app icon">
  <div class="copy">
    <h3>BarePlate</h3>
    <p>Minimal bowl-on-plate mark with rising steam. Clean lines, Saffron theme on a warm-ivory tile.</p>
    <div class="tag">assets/app-icon.svg</div>
  </div>
</body>
</html>
