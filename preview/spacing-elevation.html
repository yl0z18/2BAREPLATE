<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 34px 32px; }
  .row { display: flex; align-items: center; gap: 36px; }
  .item { text-align: center; }
  .box { width: 110px; height: 70px; background: #fff; border-radius: 14px; }
  .name { font-size: 12px; font-weight: 600; margin-top: 16px; }
  .val { font-size: 11px; color: var(--fg3); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="name">shadow-sm</div><div class="val">subtle lift</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="name">shadow-md</div><div class="val">cards</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="name">shadow-lg</div><div class="val">sheets · modals</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-pill); border-radius:999px"></div><div class="name">shadow-pill</div><div class="val">floating Add</div></div>
  </div>
</body>
</html>
