<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 28px 32px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .box { width: 84px; height: 64px; background: var(--surface); border: 1px solid var(--border-2); }
  .name { font-size: 12px; font-weight: 600; margin-top: 8px; }
  .val { font-size: 11px; color: var(--fg3); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">xs</div><div class="val">6px</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">sm</div><div class="val">10px</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">md · card</div><div class="val">14px</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">lg · sheet</div><div class="val">20px</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="name">xl</div><div class="val">28px</div></div>
    <div class="item"><div class="box" style="border-radius:999px; width:64px"></div><div class="name">pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
