<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .meta { font-size: 11px; color: var(--fg3); font-weight: 600; letter-spacing: 0.04em; margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><span class="bp-display">Enjoy your meal</span><span class="meta">Display · 34 / 700</span></div>
  <div class="row"><span class="bp-h1">My Recipes</span><span class="meta">H1 · 28 / 700</span></div>
  <div class="row"><span class="bp-h2">Garlic Butter Noodles</span><span class="meta">H2 · 22 / 600</span></div>
  <div class="row"><span class="bp-h3">Add a Recipe</span><span class="meta">H3 · 18 / 600</span></div>
</body>
</html>
