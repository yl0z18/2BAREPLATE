<!DOCTYPE html>
<html lang="en" data-theme="saffron">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--fg1); padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { }
  .chip { height: 64px; border-radius: var(--r-sm); border: 1px solid var(--border); }
  .name { font-size: 13px; font-weight: 600; margin-top: 8px; }
  .hex { font-size: 11px; color: var(--fg3); font-weight: 600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">bg</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#F7F5F2"></div><div class="name">surface</div><div class="hex">#F7F5F2</div></div>
    <div class="sw"><div class="chip" style="background:#EFEDE8"></div><div class="name">surface-2</div><div class="hex">#EFEDE8</div></div>
    <div class="sw"><div class="chip" style="background:#ECE9E4"></div><div class="name">border</div><div class="hex">#ECE9E4</div></div>
    <div class="sw"><div class="chip" style="background:#1C1A17"></div><div class="name">fg1</div><div class="hex">#1C1A17</div></div>
    <div class="sw"><div class="chip" style="background:#6B655C"></div><div class="name">fg2</div><div class="hex">#6B655C</div></div>
    <div class="sw"><div class="chip" style="background:#A8A199"></div><div class="name">fg3</div><div class="hex">#A8A199</div></div>
    <div class="sw"><div class="chip" style="background:#DEDAD3"></div><div class="name">border-2</div><div class="hex">#DEDAD3</div></div>
  </div>
</body>
</html>
